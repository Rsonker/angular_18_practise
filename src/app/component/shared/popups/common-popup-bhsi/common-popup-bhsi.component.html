<ng-template #modal>
    <div class="modal-header">
        <h5 class="modal-title">
            {{modalConfig.modalTitle}}
        </h5>
        <button type="button" class="btn-close" (click)="dismiss()"></button>
    </div>
    <div class="modal-body">
        <ng-content></ng-content>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="dismiss()"
        *ngIf="modalConfig.hideDimissButton === undefined || !modalConfig.hideDismissButton()"
        [disabled]="modalConfig.disableDismissButton !== undefined && modalConfig.disableDismissButton()">
        {{modalConfig.dismissButtonLabel ?? 'Discard'}}
    </button>
    <button type="button" class="btn btn-primary" (click)="close()"
    *ngIf="(modalConfig.hideCloseButton === undefined || !modalConfig.hideCloseButton())"
    >
        {{modalConfig.closeButtonLabel ?? 'Save'}}
    </button>
    </div>
</ng-template>
