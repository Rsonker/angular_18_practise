<ng-template #modal>
    <div>
        <form [formGroup]="taskForm" (ngSubmit)="onClose()">
            <div class="modal-header">
                <h4 class="modal-title">Task Details</h4>
                <button type="button" class="btn-close" aria-label="Close" ></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="taskName" class="form-label">Task Name</label>
                    <input type="text" class="form-control" id="taskName" formControlName="taskName" name="taskName">
                </div>
                <div class="mb-3">
                    <label for="taskDescription" class="form-label">Task Description</label>
                    <textarea class="form-control" id="taskDescription"  name="taskDescription" formControlName="taskDescription"></textarea>
                </div>
                <div class="mb-3">
                    <label for="taskDueDate" class="form-label">Due Date</label>
                    <input type="date" class="form-control" id="taskDueDate"  name="taskDueDate" formControlName="dueDate">
                </div>
                <div class="mb-3">
                    <label for="taskPriority" class="form-label">Priority</label>
                    <select class="form-select" id="taskPriority" name="taskPriority" formControlName="priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>   
                <div class="mb-3">
                    <label for="taskAssignedTo" class="form-label">Assign To</label>
                     <input type="text" class="form-control" id="assignedTo"  name="assignedTo" formControlName="assignedTo">
                </div>
                <div class="mb-3">
                    <label for="taskAssignedTo" class="form-label">Assign To</label>
                     <input type="text" class="form-control" id="assignedTo"  name="assignedTo" formControlName="assignedTo">
                </div>
                <div class="mb-3">
                    <label for="taskStatus" class="form-label">Status</label>
                    <select class="form-select" id="taskStatus" name="taskStatus" formControlName="status">
                        <option value="not-started">Not Started</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="dismiss()">Close</button>
                <button type="submit" class="btn btn-primary">Save Task</button>
            </div>
        </form>
    </div>
</ng-template>
